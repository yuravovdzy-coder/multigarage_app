name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf \
            libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libsqlite3-dev \
            cmake libssl-dev libffi-dev build-essential

      - name: Force system python3 to 3.11
        run: |
          sudo ln -sf $(which python3.11) /usr/bin/python3
          /usr/bin/python3 --version

      - name: Set Java 17 for Gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          $JAVA_HOME_17_X64/bin/java -version

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Build with Buildozer
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multigarage-apk
          path: bin/*.apk
